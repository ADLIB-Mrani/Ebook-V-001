name: Trajectoire V2 quality
on:
  pull_request:
    paths:
      - 'trajectoire-v2/**'
      - '.github/workflows/trajectoire-v2.yml'
  push:
    branches:
      - 'feat/trajectoire-v2-zero-cost'
    paths:
      - 'trajectoire-v2/**'
      - '.github/workflows/trajectoire-v2.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check trajectoire-v2/engine.js
          node --check trajectoire-v2/app.js
          node --check trajectoire-v2/sources.js
          node --check trajectoire-v2/sw.js
          node -e "JSON.parse(require('fs').readFileSync('trajectoire-v2/manifest.webmanifest','utf8'))"
      - name: Python syntax and safe bridge tests
        run: |
          python3 -m py_compile trajectoire-v2/tools/regroupement_bridge.py
          python3 -m unittest discover -s trajectoire-v2/tools -p 'test_*.py'
      - name: Unit tests without paid dependencies
        run: node --test trajectoire-v2/engine.test.cjs trajectoire-v2/sources.test.cjs
